[package]
name = "turbovec"
version = "0.8.1"
edition = "2021"
rust-version = "1.70"
description = "Fast vector quantization with 2-4 bit compression and SIMD search"
license = "MIT"
repository = "https://github.com/RyanCodrai/turbovec"
homepage = "https://github.com/RyanCodrai/turbovec"
readme = "../README.md"
keywords = ["vector-search", "quantization", "nearest-neighbor", "ann", "simd"]
categories = ["algorithms", "science", "compression"]

[features]
# `parallel` links Rayon for multi-threaded encode/search (on by default).
# Disable it (`--no-default-features`) for threadless targets such as
# `wasm32-unknown-unknown`; the crate then falls back to sequential
# iterators via `src/par.rs` with bit-identical results.
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
ndarray = "0.17"
rayon = { version = "1.10", optional = true }
ordered-float = "4"
half = "2"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
statrs = "0.17"
faer = "0.20"

# build.rs emits the BLAS link directive directly (openblas on Linux,
# Accelerate framework on macOS) so downstream binaries don't need to
# include `extern crate blas_src;` to resolve `cblas_sgemm`.
[target.'cfg(target_os = "macos")'.dependencies]
ndarray = { version = "0.17", features = ["blas"] }

[target.'cfg(target_os = "linux")'.dependencies]
ndarray = { version = "0.17", features = ["blas"] }

