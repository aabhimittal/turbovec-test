name: Deploy demo to GitHub Pages

# Publishes the site/ directory (the WebAssembly playground + benchmark
# charts) to GitHub Pages. The .wasm engine and JS glue are committed under
# site/pkg, so this workflow just uploads the static directory — no build.
#
# One-time setup: repo Settings → Pages → "Build and deployment" → Source:
# "GitHub Actions". After that this runs on every push to main touching site/.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
